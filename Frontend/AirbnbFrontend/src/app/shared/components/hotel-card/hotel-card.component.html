<div class="hotel-card" (click)="onCardClick()">
  <!-- Hotel Image -->
  <div class="hotel-image">
    <img
      [src]="hotel.image || 'assets/placeholder-hotel.jpg'"
      [alt]="hotel.name"
      class="image"
    />
    <div class="overlay">
      <button (click)="onBookNow()" class="book-btn">
        Book Now
      </button>
    </div>
  </div>

  <!-- Hotel Info -->
  <div class="hotel-info">
    <!-- Hotel Name -->
    <h3 class="hotel-name">{{ hotel.name }}</h3>

    <!-- Location -->
    <p class="location">
      📍 {{ hotel.city }}, {{ hotel.state }}
    </p>

    <!-- Description -->
    <p class="description">
      {{ hotel.description | slice: 0: 100 }}...
    </p>

    <!-- Amenities -->
    <div class="amenities">
      <span *ngFor="let amenity of hotel.amenities | slice: 0: 3" class="amenity-tag">
        {{ amenity }}
      </span>
      <span *ngIf="hotel.amenities.length > 3" class="more-amenities">
        +{{ hotel.amenities.length - 3 }} more
      </span>
    </div>

    <!-- Rating and Price -->
    <div class="footer">
      <!-- Rating -->
      <div class="rating" [ngClass]="getRatingColor()">
        <span class="stars">
          <span *ngFor="let star of getStarArray()" class="star">
            {{ star === 1 ? '⭐' : '☆' }}
          </span>
        </span>
        <span class="rating-value">{{ hotel.rating | number: '1.1-1' }}</span>
        <span class="reviews">({{ hotel.reviewsCount }} reviews)</span>
      </div>

      <!-- Price -->
      <div class="price">
        <span class="currency">$</span>
        <span class="amount">99</span>
        <span class="unit">/night</span>
      </div>
    </div>
  </div>
</div>
