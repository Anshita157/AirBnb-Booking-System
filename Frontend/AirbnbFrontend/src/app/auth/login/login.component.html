<div class="login-wrapper">
  <div class="login-container">
    <!-- Header -->
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Sign in to your account</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="form-control"
          [class.is-invalid]="submitted && f['email'].errors"
        />
        <small class="error-message" *ngIf="submitted && f['email'].errors">
          <span *ngIf="f['email'].errors['required']">Email is required</span>
          <span *ngIf="f['email'].errors['email']">Invalid email format</span>
        </small>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            class="form-control"
            [class.is-invalid]="submitted && f['password'].errors"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
          >
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <small class="error-message" *ngIf="submitted && f['password'].errors">
          <span *ngIf="f['password'].errors['required']">Password is required</span>
          <span *ngIf="f['password'].errors['minlength']"
            >Password must be at least 6 characters</span
          >
        </small>
      </div>

      <!-- Remember Me -->
      <div class="form-group checkbox">
        <input
          id="rememberMe"
          type="checkbox"
          formControlName="rememberMe"
          class="form-check-input"
        />
        <label for="rememberMe">Remember me</label>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading" class="spinner">⏳ Signing in...</span>
      </button>
    </form>

    <!-- Forgot Password -->
    <div class="forgot-password">
      <a routerLink="/auth/forgot-password">Forgot your password?</a>
    </div>

    <!-- Divider -->
    <div class="divider">
      <span>or</span>
    </div>

    <!-- Sign Up Link -->
    <div class="signup-link">
      <p>Don't have an account?</p>
      <a routerLink="/auth/signup" class="btn-link">Create an account</a>
    </div>

    <!-- Demo Credentials -->
    <div class="demo-info">
      <p><strong>Demo Credentials:</strong></p>
      <p>Email: demo@example.com</p>
      <p>Password: password123</p>
    </div>
  </div>
</div>
