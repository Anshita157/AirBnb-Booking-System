<div class="profile-container">
  <div class="profile-header">
    <h1>My Profile</h1>
    <button class="btn-edit" *ngIf="!isEditing" (click)="toggleEdit()">
      ✏️ Edit Profile
    </button>
    <div class="button-group" *ngIf="isEditing">
      <button class="btn-cancel" (click)="toggleEdit()">Cancel</button>
      <button class="btn-save" [disabled]="!profileForm.valid || loading" (click)="onSubmit()">
        {{ loading ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </div>

  <div class="profile-content" *ngIf="user">
    <div class="profile-card">
      <div class="profile-avatar">
        <span class="avatar-initial">{{ user.name.charAt(0).toUpperCase() }}</span>
      </div>

      <form [formGroup]="profileForm" class="profile-form">
        <div class="form-group">
          <label>Full Name</label>
          <input 
            type="text" 
            formControlName="name" 
            class="form-control"
            [readonly]="!isEditing">
          <small *ngIf="profileForm.get('name')?.invalid && isEditing" class="error">
            Name must be at least 2 characters
          </small>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input 
            type="email" 
            formControlName="email" 
            class="form-control"
            [readonly]="!isEditing">
          <small *ngIf="profileForm.get('email')?.invalid && isEditing" class="error">
            Please enter a valid email
          </small>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input 
            type="tel" 
            formControlName="phone" 
            class="form-control"
            placeholder="10-digit mobile number"
            [readonly]="!isEditing">
          <small *ngIf="profileForm.get('phone')?.invalid && isEditing" class="error">
            Please enter a valid 10-digit phone number
          </small>
        </div>

        <div class="form-group">
          <label>Address</label>
          <textarea 
            formControlName="address" 
            class="form-control"
            rows="3"
            [readonly]="!isEditing"></textarea>
        </div>

        <div class="form-group">
          <label>Account Type</label>
          <input 
            type="text" 
            class="form-control" 
            [value]="user.role | uppercase" 
            readonly>
        </div>
      </form>

      <div class="profile-actions">
        <button class="btn-password" (click)="goToChangePassword()">
          🔐 Change Password
        </button>
        <button class="btn-logout" (click)="logout()">
          🚪 Logout
        </button>
      </div>
    </div>

    <div class="profile-info">
      <h3>Account Information</h3>
      <div class="info-item">
        <span class="info-label">Member Since:</span>
        <span class="info-value">2024</span>
      </div>
      <div class="info-item">
        <span class="info-label">Total Bookings:</span>
        <span class="info-value">12</span>
      </div>
      <div class="info-item">
        <span class="info-label">Status:</span>
        <span class="info-value verified">✓ Verified</span>
      </div>
    </div>
  </div>
</div>
