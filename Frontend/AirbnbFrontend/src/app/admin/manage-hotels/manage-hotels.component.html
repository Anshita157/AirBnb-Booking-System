<div class="manage-container">
  <div class="manager-header">
    <h1>Manage Hotels</h1>
    <button class="btn-add" routerLink="/admin/add-hotel">+ Add New Hotel</button>
  </div>

  <div class="table-wrapper" *ngIf="!loading">
    <table class="data-table">
      <thead>
        <tr>
          <th>Hotel Name</th>
          <th>Location</th>
          <th>Rating</th>
          <th>Rooms</th>
          <th>Revenue</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let hotel of hotels">
          <td><strong>{{ hotel.name }}</strong></td>
          <td>{{ hotel.location }}</td>
          <td>⭐ {{ hotel.rating }}</td>
          <td>{{ hotel.rooms }}</td>
          <td>₹{{ hotel.revenue | number }}</td>
          <td>
            <button class="btn-sm edit" (click)="editHotel(hotel.id)">Edit</button>
            <button class="btn-sm delete" (click)="deleteHotel(hotel.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="loading" class="loading">Loading hotels...</div>
</div>
