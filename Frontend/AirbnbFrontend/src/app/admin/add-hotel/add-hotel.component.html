<div class="form-container">
  <h1>Add New Hotel</h1>
  <form [formGroup]="hotelForm" (ngSubmit)="onSubmit()" class="form">
    <div class="form-group">
      <label>Hotel Name</label>
      <input type="text" formControlName="name" class="form-control" placeholder="Enter hotel name">
    </div>
    <div class="form-group">
      <label>Location</label>
      <input type="text" formControlName="location" class="form-control" placeholder="Enter location">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" class="form-control" placeholder="Enter description" rows="4"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Price Per Night (₹)</label>
        <input type="number" formControlName="pricePerNight" class="form-control" placeholder="5000">
      </div>
      <div class="form-group">
        <label>Rating</label>
        <input type="number" formControlName="rating" class="form-control" placeholder="4.5" min="0" max="5" step="0.1">
      </div>
    </div>
    <div class="form-group">
      <label>Hotel Image URL</label>
      <input type="text" formControlName="image" class="form-control" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>Amenities (comma-separated)</label>
      <input type="text" formControlName="amenities" class="form-control" placeholder="WiFi, AC, TV, ...">
    </div>
    <button type="submit" [disabled]="loading" class="btn-submit">
      {{ loading ? 'Adding...' : 'Add Hotel' }}
    </button>
  </form>
</div>
