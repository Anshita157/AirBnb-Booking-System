<div class="manage-container">
  <div class="manager-header">
    <h1>Manage Bookings</h1>
  </div>

  <div class="table-wrapper" *ngIf="!loading">
    <table class="data-table">
      <thead>
        <tr>
          <th>Booking ID</th>
          <th>Hotel</th>
          <th>Guest</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let booking of bookings">
          <td><strong>{{ booking.id }}</strong></td>
          <td>{{ booking.hotel }}</td>
          <td>{{ booking.guest }}</td>
          <td>₹{{ booking.amount | number }}</td>
          <td>
            <select class="status-select" (change)="onStatusChange(booking.id, $event)">
              <option [value]="booking.status" selected>{{ booking.status | uppercase }}</option>
              <option value="confirmed">Confirmed</option>
              <option value="pending">Pending</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </td>
          <td>{{ booking.date }}</td>
          <td>
            <button class="btn-sm" (click)="viewDetails(booking.id)">View</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
