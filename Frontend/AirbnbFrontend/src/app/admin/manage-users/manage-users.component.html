<div class="manage-container">
  <div class="manager-header">
    <h1>Manage Users</h1>
  </div>

  <div class="table-wrapper" *ngIf="!loading">
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Join Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td><strong>{{ user.name }}</strong></td>
          <td>{{ user.email }}</td>
          <td>
            <select class="role-select" (change)="onRoleChange(user.id, $event)">
              <option [value]="user.role" selected>{{ user.role | uppercase }}</option>
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </td>
          <td>{{ user.joinDate }}</td>
          <td>
            <button class="btn-sm delete" (click)="deleteUser(user.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
