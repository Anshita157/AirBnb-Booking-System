<div class="booking-container">
  <div class="booking-header">
    <h1>Book Your Hotel</h1>
    <p>Complete your booking for HotelID: {{ hotelId || 'Not specified' }}</p>
  </div>

  <div class="booking-form">
    <p>Booking form with room selection, guest details, and special requests coming soon...</p>
    <button (click)="proceedToPayment()" class="btn-proceed">Proceed to Payment</button>
  </div>
</div>
